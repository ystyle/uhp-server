# uhp-server 配置样例：复制成 uhp-server.toml 再改

[server]
bind = "127.0.0.1"
port = 8488
# 增量批量窗口（毫秒）：插件进程的上报先攒 25ms 再合并成批交给 UHP 的事件通道；
# 0 = 每条都立即转发（想看原始粒度时用）
event_batch_ms = 25
# harness 插件进程的通信方式：stdio（默认，逐行 JSON）| uds（unix socket + Content-Length 帧）。
# 两者都支持；uds 少一层逐行 framing，容器里需要 /tmp 可写。
plugin_transport = "stdio"
# 空闲会话存活秒数：0 = 不回收。长跑部署建议开（如 1800）
session_ttl_seconds = 0

# 客户端凭证：token -> principal（建议一个客户端一个 token）
[[tokens]]
token = "dev-token"
principal = "starline"

# ---- harness 1：scripted（不接模型，用来验证部署/协议是否通）----
[[harnesses]]
id = "echo"
name = "echo（自检用）"
kind = "scripted"
default_model = "auto"
reply = "hello from uhp-server"

# ---- harness 2：opencode（opencode serve 的 HTTP API）----
[[harnesses]]
id = "opencode"
name = "opencode"
kind = "opencode"
default_model = "auto"
base_url = "http://127.0.0.1:4776"
directory = "/work/ws"
user = "opencode"
password = ""

# ---- harness 3：dsh / pi（任何 ACP agent；pi 需要 pi-acp 这类适配器）----
[[harnesses]]
id = "dsh"
name = "DSH"
kind = "acp"
default_model = "auto"
command = "dsh"
args = ["--profile", "acp"]
cwd = "/work/ws"
session_mode = "parallel"   # serial（默认）| parallel（确认 agent 支持并发回合再用）
timeout_seconds = 600
permission_timeout_seconds = 600

# ---- 自己写的插件（不改 uhp-server，只写配置）：docs/writing-a-harness.md ----
