[package]
  cjc-version = "1.2.0"
  name = "uhp_server"
  version = "0.1.0"
  description = "UHP Server：把多个 harness（opencode / dsh / pi …）统一成一个 UHP 端点"
  output-type = "executable"
  compile-option = "-Woff unused --static"
  link-option = "-lstdx.crypto.digest"
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/uhp-server"
  include = ["/src", "/LICENSE"]
  exclude = ["/docs", "/config", "/scripts", "/docker", "/.github", "/target", "/src/**/*_test.cj"]

[dependencies]
  # 开发期用同工作区的 path 依赖；对外构建时切成中心仓版本（见 docs/design.md「发布」）
  # uhp 0.1.1 已发中心仓：直接按版本依赖，构建不再需要同级 checkout
  "uhp" = "0.1.1"
  "uhp_acp" = "0.1.1"
  "uhp_opencode" = "0.1.1"
  "tomlcj" = "1.0.0"
  # P1：适配器进程隔离托管。cordis 0.3.1 起已发中心仓，直接按版本依赖（消费者视角，不再需要同级 checkout）。
  "ystyle::cordis_core" = "0.3.1"
  "ystyle::cordis_host" = "0.3.1"
  "ystyle::cordis_plugin" = "0.3.1"
  "ystyle::jsonrpc" = "0.7.9"
  "jsonvalue" = "1.1.1"

# harness 插件进程（P1：适配器隔离）。宿主按需拉起它，一个插件承载一个 harness。
[package.package-configuration."uhp_server.plugin"]
  output-type = "executable"

# 示例插件：自己写适配器的参照实现（docs/writing-a-harness.md）
[package.package-configuration."uhp_server.examples.echo_plugin"]
  output-type = "executable"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
