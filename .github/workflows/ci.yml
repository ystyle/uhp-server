name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    name: 构建 · 测试（含 e2e，不需要模型）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout uhp-server
        uses: actions/checkout@v4
        with:
          path: uhp-server

      # 开发期依赖同工作区的 SDK 仓（path 依赖 ../uhp/*）；发布后换成中心仓版本。
      - name: Checkout uhp（SDK + 适配器）
        uses: actions/checkout@v4
        with:
          repository: ystyle/uhp
          path: uhp

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0
          components: stdx

      - name: Build
        working-directory: uhp-server
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: cjpm build -j 8

      - name: Tests
        working-directory: uhp-server
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: timeout 600 cjpm test -j 4
