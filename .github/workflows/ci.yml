name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    name: 构建 · 测试（含 e2e，不需要模型）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout uhp-server
        uses: actions/checkout@v4
        with:
          path: uhp-server

      # cordis（插件宿主）已发中心仓 0.3.1，按版本依赖，不需要同级 checkout。
      # uhp/uhp-acp 仍是 path 依赖（其 0.1.1 尚未发布），发布后同样切成中心仓版本。
      - name: Checkout uhp（SDK + 适配器）
        uses: actions/checkout@v4
        with:
          repository: ystyle/uhp
          path: uhp

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0
          components: stdx

      - name: Build
        working-directory: uhp-server
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: cjpm build -j 8

      - name: Tests
        working-directory: uhp-server
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: timeout 600 cjpm test -j 4

      # 打包产物给镜像任务用（target/ 不进镜像上下文，见 .dockerignore）
      - name: 收集镜像产物（dist/）
        working-directory: uhp-server
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: bash scripts/make-dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: uhp-server-dist
          path: uhp-server/dist
          if-no-files-found: error

  docker:
    name: 镜像构建 · 容器冒烟
    runs-on: ubuntu-24.04
    needs: build-test
    # PR 上只跑构建测试；镜像只在 master 推送上验一次
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: uhp-server-dist
          path: dist

      - name: Build image
        run: docker build -t uhp-server:ci .

      # 冒烟覆盖三件容易在镜像里丢掉的事：进程内 harness、插件进程 harness（uhp_server.plugin 在不在）、
      # 以及 SIGTERM 处理（PID 1 会忽略未处理信号 → 没有入口脚本转发就会等满 10s）
      - name: 容器冒烟（含插件进程与停止耗时）
        run: bash scripts/docker-smoke.sh uhp-server:ci 18488
